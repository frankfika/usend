    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "description": "A secure, end-to-end encrypted file and text transfer tool with no sign-up.",

        ]
      }
    </script>
    <script>
      // Force HTTPS if the page is ever loaded over plain HTTP.
      // The Worker already redirects, but this guards the brief window
      // where a stale DNS / proxy might still serve a HTTP page directly.
      (function () {
        try {
          if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            location.replace("https://" + location.host + location.pathname + location.search + location.hash);
          }
        } catch (_) {}
      })();
    </script>
